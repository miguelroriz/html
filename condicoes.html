<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8">
    <title>Estrutura de condição</title>
    <script>
    const n1 = Number(prompt("Digite a nota 1:"));
    const n2 = Number(prompt("Digite a nota 2:"));
    const media = (n1 + n2) / 2;

    console.log("Nota 1: " + n1);
    console.log("Nota 2: " + n2);
    console.log("Média: " + media);

    if (media >= 7) {
        console.log("Aprovado");
    } else if (media >= 5) {
        console.log("Recuperação");
    } else {
        console.log("Reprovado");
    }
    </script>
    </head>
    <body>
        
    </body>
</html>
